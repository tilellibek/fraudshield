<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion — FraudShield</title>
    <style>
        *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;font-family:Arial,Helvetica,sans-serif;background:radial-gradient(circle at 15% 15%,#172554 0,transparent 32%),radial-gradient(circle at 85% 80%,#3b0764 0,transparent 30%),#080d19;color:#f1f5f9}.connexion{width:100%;max-width:440px;padding:38px;border:1px solid #26334a;border-radius:20px;background:rgba(17,26,46,.94);box-shadow:0 24px 70px rgba(0,0,0,.42)}.marque{display:flex;align-items:center;gap:14px;margin-bottom:32px}.logo{display:grid;width:52px;height:52px;place-items:center;border-radius:15px;background:linear-gradient(135deg,#3b82f6,#a855f7);font-weight:800}.marque strong,.marque span{display:block}.marque strong{font-size:20px}.marque span{margin-top:4px;color:#94a3b8;font-size:12px}.sur-titre{margin:0;color:#60a5fa;font-size:11px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase}h1{margin:8px 0 10px;font-size:29px}p{margin:0 0 28px;color:#94a3b8;line-height:1.55}form{display:grid;gap:18px}label{display:grid;gap:8px;font-size:14px;font-weight:700}input{width:100%;padding:13px 14px;border:1px solid #26334a;border-radius:10px;background:#0d1424;color:#f1f5f9;font:inherit}input:focus{border-color:#3b82f6;outline:none;box-shadow:0 0 0 3px rgba(59,130,246,.15)}button{display:flex;align-items:center;justify-content:center;min-height:48px;margin-top:6px;border:0;border-radius:10px;background:linear-gradient(135deg,#2563eb,#7c3aed);color:white;font:inherit;font-weight:800;cursor:pointer}button:disabled{opacity:.6;cursor:wait}.message{margin:18px 0 0;padding:12px;border:1px solid rgba(239,68,68,.35);border-radius:9px;background:rgba(239,68,68,.1);color:#fca5a5;font-size:13px}.cache{display:none}.securite{margin-top:24px;padding-top:20px;border-top:1px solid #26334a;color:#64748b;font-size:12px;text-align:center}@media(max-width:500px){.connexion{padding:28px 22px}}
    </style>
</head>
<body>
    <main class="connexion">
        <div class="marque"><div class="logo">FS</div><div><strong>FraudShield</strong><span>Analyse intelligente</span></div></div>
        <p class="sur-titre">Espace sécurisé</p><h1>Connexion analyste</h1><p>Identifiez-vous pour accéder aux analyses, aux alertes et à l’historique.</p>
        <form id="formulaire-connexion">
            <label for="identifiant">Identifiant<input id="identifiant" name="identifiant" autocomplete="username" required></label>
            <label for="mot-de-passe">Mot de passe<input id="mot-de-passe" name="mot-de-passe" type="password" autocomplete="current-password" minlength="8" required></label>
            <button id="bouton-connexion" type="submit">Se connecter</button>
        </form>
        <p id="message-connexion" class="message cache" role="alert"></p>
        <div class="securite">Session sécurisée · Durée maximale : 8 heures</div>
    </main>
    <script src="js/connexion.js"></script>
</body>
</html>
